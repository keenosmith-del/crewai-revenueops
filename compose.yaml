name: revenueops
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: revenueops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: revenueops
    ports: ["127.0.0.1:55433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueops"]
      interval: 3s
      retries: 20
  api:
    image: revenueops-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://revenueops:${POSTGRES_PASSWORD:-local-only}@db/revenueops
    ports: ["127.0.0.1:${API_PORT:-5050}:5050"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 5050"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health')"]
      interval: 5s
      retries: 20
  worker:
    image: revenueops-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://revenueops:${POSTGRES_PASSWORD:-local-only}@db/revenueops
    depends_on:
      api: {condition: service_healthy}
    command: ["python", "-m", "app.workers.runner"]
  web:
    image: revenueops-web:local
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-5173}:8080"]
    depends_on: [api]
volumes:
  pgdata:
