name: Verify RevenueOps
on: [push, pull_request]
permissions: {contents: read}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: revenueops, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: revenueops_test}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U revenueops' --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://revenueops:ci-only@localhost:5432/revenueops_test
      TEST_DATABASE_URL: postgresql+psycopg://revenueops:ci-only@localhost:5432/revenueops_test
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TRACING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-lock.txt}
      - run: pip install -r backend/requirements-lock.txt
      - run: pip check
      - run: ruff check backend scripts tests && ruff format --check backend scripts tests
      - run: cd backend && alembic upgrade head && alembic check
      - run: cd backend && pytest -q --junitxml=../backend-results.xml
      - run: pytest -q tests/release
      - run: PYTHONPATH=backend python -m app.evaluations.runner
      - run: python scripts/check_contracts.py
      - run: python scripts/check_dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: |
            backend-results.xml
            docs/testing/evaluation.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npm audit --audit-level=moderate
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_USER: revenueops, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: revenueops_browser_test}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U revenueops' --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://revenueops:ci-only@localhost:5432/revenueops_browser_test
      APP_ENV: test
      JWT_SECRET: synthetic-browser-test-only-secret-2026
      CORS_ORIGINS: '["http://127.0.0.1:5174"]'
      REVENUEOPS_API_URL: http://127.0.0.1:5051
      E2E_URL: http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install -r backend/requirements-lock.txt
      - run: cd backend && alembic upgrade head && python -m app.db.seed
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Start local application and verify workflows
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 5051 > /tmp/api.log 2>&1 &
          cd ../frontend
          npm run dev -- --port 5174 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5174/health >/dev/null && break || true; sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/api.log
            /tmp/web.log
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t revenueops-api:ci .
      - run: docker build -t revenueops-web:ci frontend
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
